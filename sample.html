<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘플 페이지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card p {
            color: #666;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 샘플 페이지</h1>
            <p>현대적인 HTML & CSS 예제</p>
        </header>

        <div class="card-grid">
            <div class="card">
                <h2>📱 반응형 디자인</h2>
                <p>모든 기기에서 아름답게 표시되는 반응형 웹 디자인입니다. 데스크톱, 태블릿, 모바일에서 최적화되어 있습니다.</p>
                <div class="button-group">
                    <button onclick="alert('더 알아보기 클릭됨!')">더 알아보기</button>
                </div>
            </div>

            <div class="card">
                <h2>✨ 현대적 스타일</h2>
                <p>그래디언트, 그림자, 호버 효과 등 최신 CSS 기술을 사용하여 세련된 UI를 만들었습니다.</p>
                <div class="button-group">
                    <button onclick="alert('스타일 정보!')">자세히</button>
                </div>
            </div>

            <div class="card">
                <h2>⚡ 빠른 성능</h2>
                <p>최적화된 코드와 효율적인 리소스 로딩으로 빠른 페이지 로딩과 부드러운 애니메이션을 제공합니다.</p>
                <div class="button-group">
                    <button onclick="alert('성능 팁!')">확인하기</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 샘플 페이지 | Claude Code로 생성됨</p>
        </footer>
    </div>

    <script>
        console.log('샘플 페이지가 로드되었습니다!');

        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM이 준비되었습니다.');
        });
    </script>
</body>
</html>
